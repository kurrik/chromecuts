<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8eaf0;
    background: #0f1117;
    background-image:
      radial-gradient(ellipse 80% 70% at 15% 20%, rgba(99,102,241,0.45), transparent 55%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(79,70,229,0.25), transparent 50%);
    display: flex;
    align-items: center;
    padding: 28px 32px;
    gap: 20px;
  }
  .icon {
    width: 88px; height: 88px; flex-shrink: 0;
    border-radius: 22px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .copy { min-width: 0; }
  .name {
    font-size: 28px; font-weight: 750; letter-spacing: -0.03em;
    line-height: 1.1; margin-bottom: 8px;
  }
  .tag {
    font-size: 14px; line-height: 1.4; color: #a5b4fc;
    font-weight: 600; margin-bottom: 14px;
  }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; }
  .kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; font-weight: 700;
    background: #1a1d27; border: 1px solid #2e3345;
    border-radius: 6px; padding: 4px 8px; color: #e8eaf0;
  }
</style>
</head>
<body>
  <img class="icon" src="icon128.png" width="88" height="88" alt="" />
  <div class="copy">
    <div class="name">ChromeCuts</div>
    <div class="tag">Tab shortcuts, remapped</div>
    <div class="keys">
      <span class="kbd">⌘⇧J</span>
      <span class="kbd">⌘⇧K</span>
      <span class="kbd">prev / next</span>
    </div>
  </div>
</body>
</html>
