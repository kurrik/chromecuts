<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    background: #0b0d12;
    display: flex;
    flex-direction: column;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .chrome {
    height: 40px; flex-shrink: 0;
    background: #1a1d27;
    border-bottom: 1px solid #2e3345;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .url {
    margin-left: 12px; flex: 1; max-width: 420px;
    background: #0f1117; border: 1px solid #2e3345; border-radius: 6px;
    color: #9aa3b5; font-size: 12px; padding: 5px 10px;
  }
  .stage {
    flex: 1; overflow: hidden; position: relative;
    display: flex; align-items: flex-start; justify-content: center;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,0.2), transparent),
      #0f1117;
  }
  .stage img {
    width: 1280px;
    height: auto;
    display: block;
    transform: translateY(-8px);
  }
  .banner {
    position: absolute; left: 24px; bottom: 22px;
    background: rgba(26,29,39,0.92);
    border: 1px solid #2e3345;
    border-radius: 10px;
    padding: 12px 16px;
    color: #e8eaf0;
    font-size: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .banner strong { color: #a5b4fc; }
</style>
</head>
<body>
  <div class="chrome">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div class="url">chrome-extension://…/options.html</div>
  </div>
  <div class="stage">
    <img src="../options-demo.png" alt="ChromeCuts options" />
    <div class="banner">See every command · remap via <strong>chrome://extensions/shortcuts</strong></div>
  </div>
</body>
</html>
