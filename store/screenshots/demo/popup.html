<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icon32.png" width="22" height="22" alt="" />
      <div>
        <h1>ChromeCuts</h1>
        <p class="tagline">Tab navigation shortcuts</p>
      </div>
    </div>
  </header>
  <section class="section">
    <div class="section-head">
      <h2>Active shortcuts</h2>
      <span class="badge">4 bound</span>
    </div>
    <ul class="shortcut-list">
      <li><span class="desc">Switch to previous tab</span><span class="kbd">⌘⇧J</span></li>
      <li><span class="desc">Switch to next tab</span><span class="kbd">⌘⇧K</span></li>
      <li><span class="desc">Move tab left</span><span class="kbd">⌥⇧K</span></li>
      <li><span class="desc">Move tab right</span><span class="kbd">⌥⇧J</span></li>
    </ul>
  </section>
  <footer class="footer">
    <button type="button">Remap keys</button>
    <button type="button" class="secondary">All commands</button>
  </footer>
</body>
</html>
