<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e8eaf0;
    background: #0b0d12;
    background-image:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(99,102,241,0.25), transparent);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px;
  }
  h1 {
    font-size: 36px; font-weight: 750; letter-spacing: -0.02em;
    margin-bottom: 12px; text-align: center;
  }
  .sub { color: #9aa3b5; font-size: 17px; margin-bottom: 48px; text-align: center; }
  .grid {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px 40px;
    align-items: stretch; width: 100%; max-width: 980px;
  }
  .card {
    background: #1a1d27; border: 1px solid #2e3345; border-radius: 16px;
    padding: 28px 32px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #9aa3b5; margin-bottom: 20px; font-weight: 600;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid #2e3345; font-size: 16px;
  }
  .row:last-child { border-bottom: none; }
  .kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700; font-size: 18px;
    background: #242836; border: 1px solid #2e3345;
    border-radius: 8px; padding: 6px 12px;
  }
  .arrow {
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #6366f1; font-weight: 700;
  }
  .card.new { border-color: #6366f1; box-shadow: 0 0 0 1px rgba(99,102,241,0.3), 0 20px 50px rgba(99,102,241,0.12); }
  .card.new h2 { color: #a5b4fc; }
  .note { margin-top: 40px; color: #6b7289; font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <h1>Same modifiers. Better keys.</h1>
  <p class="sub">Chrome’s tab switchers use [ and ]. ChromeCuts keeps ⌘⇧ and swaps in J / K.</p>
  <div class="grid">
    <div class="card">
      <h2>Chrome built-in</h2>
      <div class="row"><span>Previous tab</span><span class="kbd">⌘⇧[</span></div>
      <div class="row"><span>Next tab</span><span class="kbd">⌘⇧]</span></div>
    </div>
    <div class="arrow">→</div>
    <div class="card new">
      <h2>ChromeCuts default</h2>
      <div class="row"><span>Previous tab</span><span class="kbd">⌘⇧J</span></div>
      <div class="row"><span>Next tab</span><span class="kbd">⌘⇧K</span></div>
    </div>
  </div>
  <p class="note">Remap any of 20 tab commands in chrome://extensions/shortcuts</p>
</body>
</html>
