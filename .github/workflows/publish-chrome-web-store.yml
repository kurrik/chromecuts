# Manually publish / update ChromeCuts on the Chrome Web Store,
# auto-bump version, commit, tag, and create a GitHub Release.
#
# Required repo secrets (only if cws_action is upload or publish):
#   CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
#
# Setup: store/chrome-web-store-publish.md

name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (e.g. 1.1.0). Leave blank to auto-increment."
        required: false
        type: string
        default: ""
      bump:
        description: "When version is blank, which component to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      cws_action:
        description: "Chrome Web Store: none = dry run (no CWS API); upload = draft only; publish = upload + submit"
        required: true
        type: choice
        options:
          - none
          - upload
          - publish
        default: none
      create_github_release:
        description: "Commit version bump, tag vX.Y.Z, and create a GitHub Release with the zip"
        required: true
        type: boolean
        default: true

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Version, package, upload, release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log run mode
        env:
          CWS_ACTION: ${{ inputs.cws_action }}
          CREATE_RELEASE: ${{ inputs.create_github_release }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "cws_action=$CWS_ACTION"
          echo "create_github_release=$CREATE_RELEASE"
          echo "bump=$BUMP"
          echo "version_input=${VERSION:-<auto>}"
          case "$CWS_ACTION" in
            none)
              echo "Mode: DRY RUN — package only; no Chrome Web Store API calls."
              ;;
            upload)
              echo "Mode: UPLOAD — draft package to CWS; will NOT call publish."
              ;;
            publish)
              echo "Mode: PUBLISH — upload then submit for CWS review."
              ;;
            *)
              echo "::error::Unknown cws_action=$CWS_ACTION"
              exit 1
              ;;
          esac

      - name: Verify required secrets
        if: ${{ inputs.cws_action == 'upload' || inputs.cws_action == 'publish' }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          missing=0
          for name in CHROME_EXTENSION_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets documented in store/chrome-web-store-publish.md"
            exit 1
          fi

      - name: Resolve and set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          chmod +x scripts/resolve-and-set-version.py
          if [ -n "${INPUT_VERSION// }" ]; then
            scripts/resolve-and-set-version.py --version "$INPUT_VERSION" | tee /tmp/version.out
          else
            scripts/resolve-and-set-version.py --bump "$INPUT_BUMP" | tee /tmp/version.out
          fi
          version="$(sed -n 's/^version=//p' /tmp/version.out | tail -1)"
          previous="$(sed -n 's/^previous=//p' /tmp/version.out | tail -1)"
          mode="$(sed -n 's/^mode=//p' /tmp/version.out | tail -1)"
          if [ -z "$version" ]; then
            echo "::error::Failed to resolve version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $previous → $version ($mode)"

      - name: Package extension
        id: package
        run: |
          chmod +x scripts/package-extension.sh
          scripts/package-extension.sh store | tee /tmp/package.out
          version="$(sed -n 's/^version=//p' /tmp/package.out | tail -1)"
          zip_path="$(sed -n 's/^zip_path=//p' /tmp/package.out | tail -1)"
          if [ -z "$version" ] || [ -z "$zip_path" ] || [ ! -f "$zip_path" ]; then
            echo "::error::Packaging failed to produce version/zip_path"
            cat /tmp/package.out
            exit 1
          fi
          if [ "$version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Package version $version != resolved ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          ls -la "$zip_path"
          ZIP_PATH="$zip_path" EXPECT_VERSION="$version" python3 - <<'PY'
          import json, os, zipfile
          path = os.environ["ZIP_PATH"]
          expect = os.environ["EXPECT_VERSION"]
          z = zipfile.ZipFile(path)
          print("zip entries:")
          for n in z.namelist()[:40]:
              print(" ", n)
          assert "manifest.json" in z.namelist(), "manifest.json missing at zip root"
          data = json.loads(z.read("manifest.json"))
          assert data["version"] == expect, (data["version"], expect)
          print("manifest version in zip:", data["version"])
          PY

      - name: Set up Node
        if: ${{ inputs.cws_action == 'upload' || inputs.cws_action == 'publish' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload package to Chrome Web Store (draft)
        id: cws_upload
        if: ${{ inputs.cws_action == 'upload' || inputs.cws_action == 'publish' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail
          echo "Calling CWS upload API only (not publish)…"
          set +e
          out="$(npx --yes chrome-webstore-upload-cli@3 upload \
            --source "$ZIP_PATH" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -q 'ITEM_NOT_UPDATABLE'; then
              echo "::error::Chrome Web Store rejected the upload: item is not updatable right now."
              echo "Usually this means the listing is still pending review, ready to publish, or deleted."
              echo "Wait for review to finish, or cancel the submission in the Developer Dashboard, then re-run."
              echo "This is NOT the publish step — only package upload was attempted."
            fi
            exit "$code"
          fi
          if echo "$out" | grep -q "uploadState: 'FAILURE'"; then
            echo "::error::CWS returned uploadState FAILURE"
            exit 1
          fi
          echo "Upload API succeeded (draft package on item)."

      - name: Submit for publish/review on Chrome Web Store
        if: ${{ inputs.cws_action == 'publish' }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          echo "Calling CWS publish API (submit for review)…"
          npx --yes chrome-webstore-upload-cli@3 publish \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

      - name: Skip all Chrome Web Store API calls
        if: ${{ inputs.cws_action == 'none' }}
        run: |
          echo "cws_action=none → no upload and no publish. Local package only."

      # Persist version only after a successful package (and CWS steps if any).
      - name: Commit version, tag, and create GitHub Release
        if: ${{ inputs.create_github_release == true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          MODE: ${{ steps.version.outputs.mode }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CWS_ACTION: ${{ inputs.cws_action }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/manifest.json
          if git diff --cached --quiet; then
            echo "::error::manifest version was not changed; refusing empty release commit"
            exit 1
          fi

          git commit -m "Release v${VERSION}

          Package ${VERSION} (${MODE}; was ${PREVIOUS}).
          Chrome Web Store action: ${CWS_ACTION}."

          git tag -a "v${VERSION}" -m "ChromeCuts v${VERSION}"

          git push origin "HEAD:${BRANCH}"
          git push origin "v${VERSION}"

          case "$CWS_ACTION" in
            none) cws_note="not sent to Chrome Web Store (dry run)" ;;
            upload) cws_note="uploaded as draft only (not submitted for review)" ;;
            publish) cws_note="uploaded and submitted for publish/review" ;;
          esac

          notes="$(cat <<EOF
          ## ChromeCuts v${VERSION}

          - **Previous version:** ${PREVIOUS}
          - **Bump mode:** ${MODE}
          - **Chrome Web Store:** ${cws_note}
          - **Extension ID:** \`${EXTENSION_ID:-n/a}\`

          Package artifact: \`chromecuts-${VERSION}.zip\` (attached to this release).

          Install from source: load unpacked \`src/\` at this tag, or use the store listing once available.
          EOF
          )"

          gh release create "v${VERSION}" "$ZIP_PATH" \
            --title "v${VERSION}" \
            --notes "$notes"

          echo "Created tag and release v${VERSION}"

      - name: Upload zip as workflow artifact
        if: ${{ always() && steps.package.outputs.zip_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromecuts-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          MODE: ${{ steps.version.outputs.mode }}
          CWS_ACTION: ${{ inputs.cws_action }}
          RELEASE: ${{ inputs.create_github_release }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          {
            echo "## ChromeCuts release run"
            echo ""
            echo "- **Version:** \`${PREVIOUS:-?} → ${VERSION:-?}\` (\`${MODE:-?}\`)"
            echo "- **cws_action:** \`$CWS_ACTION\`"
            echo "- **GitHub release:** \`$RELEASE\`"
            echo "- **Extension ID:** \`${EXTENSION_ID:-n/a}\`"
            case "$CWS_ACTION" in
              none) echo "- **CWS:** no API calls (true dry run)" ;;
              upload) echo "- **CWS:** upload only (no publish)" ;;
              publish) echo "- **CWS:** upload + publish" ;;
            esac
            if [ -n "${VERSION:-}" ] && [ "$RELEASE" = "true" ]; then
              echo "- **Tag:** \`v${VERSION}\`"
              echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
